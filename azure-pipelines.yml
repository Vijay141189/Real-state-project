trigger:
  branches:
    include:
      - main
  paths:
    include:
      - '*'

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  # Name of the Azure DevOps Service Connection (Service Principal) you create in
  # Project Settings -> Service connections -> New service connection -> Azure Resource Manager
  azureServiceConnection: 'azure-realestate-sc'

  # Name of the ADO Environment used to gate the apply stage with manual approval.
  # Create this under Pipelines -> Environments (name must match exactly).
  approvalEnvironment: 'realestate-prod'

  terraformVersion: '1.7.5'
  workingDirectory: '$(System.DefaultWorkingDirectory)'

stages:
  # ---------------------------------------------------------------------
  # Stage 1: fmt + validate + plan  (runs on every PR and every main push)
  # ---------------------------------------------------------------------
  - stage: Plan
    displayName: 'Terraform Plan'
    jobs:
      - job: TerraformPlan
        displayName: 'Init, Validate & Plan'
        steps:
          - task: TerraformInstaller@1
            displayName: 'Install Terraform'
            inputs:
              terraformVersion: '$(terraformVersion)'

          - task: AzureCLI@2
            displayName: 'Terraform Init'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              addSpnToEnvironment: true
              inlineScript: |
                set -eu
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_CLIENT_SECRET=$servicePrincipalKey
                export ARM_TENANT_ID=$tenantId
                export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)

                terraform init -input=false
              workingDirectory: '$(workingDirectory)'

          - task: AzureCLI@2
            displayName: 'Terraform Validate'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -eu
                terraform fmt -check -recursive
                terraform validate
              workingDirectory: '$(workingDirectory)'

          - task: AzureCLI@2
            displayName: 'Terraform Plan'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              addSpnToEnvironment: true
              inlineScript: |
                set -eu
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_CLIENT_SECRET=$servicePrincipalKey
                export ARM_TENANT_ID=$tenantId
                export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                export TF_VAR_postgres_admin_password="$(POSTGRES_ADMIN_PASSWORD)"

                terraform plan -input=false -out=tfplan
              workingDirectory: '$(workingDirectory)'

          - publish: '$(workingDirectory)/tfplan'
            artifact: tfplan
            displayName: 'Publish plan artifact'

  # ---------------------------------------------------------------------
  # Stage 2: apply  (only on main branch, gated by environment approval)
  # ---------------------------------------------------------------------
  - stage: Apply
    displayName: 'Terraform Apply'
    dependsOn: Plan
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: TerraformApply
        displayName: 'Apply (manual approval required)'
        environment: '$(approvalEnvironment)'
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: TerraformInstaller@1
                  displayName: 'Install Terraform'
                  inputs:
                    terraformVersion: '$(terraformVersion)'

                - download: current
                  artifact: tfplan

                - task: AzureCLI@2
                  displayName: 'Terraform Init'
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    addSpnToEnvironment: true
                    inlineScript: |
                      set -eu
                      export ARM_CLIENT_ID=$servicePrincipalId
                      export ARM_CLIENT_SECRET=$servicePrincipalKey
                      export ARM_TENANT_ID=$tenantId
                      export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)

                      terraform init -input=false
                    workingDirectory: '$(Pipeline.Workspace)/s'

                - task: AzureCLI@2
                  displayName: 'Terraform Apply'
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    addSpnToEnvironment: true
                    inlineScript: |
                      set -eu
                      export ARM_CLIENT_ID=$servicePrincipalId
                      export ARM_CLIENT_SECRET=$servicePrincipalKey
                      export ARM_TENANT_ID=$tenantId
                      export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)

                      terraform apply -input=false -auto-approve "$(Pipeline.Workspace)/tfplan/tfplan"
                    workingDirectory: '$(Pipeline.Workspace)/s'